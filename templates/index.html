<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企业微信消息推送</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #f0f2f5;
            --card: #ffffff;
            --primary: #0052d9;
            --primary-hover: #0043aa;
            --text: #172b4d;
            --text-muted: #6b778c;
            --border: #dfe1e6;
            --success: #066637;
            --success-bg: #e3fcef;
            --error: #bf2600;
            --error-bg: #ffebe6;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: var(--card);
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            padding: 40px;
            width: 100%;
            max-width: 560px;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 13px;
            color: var(--text-muted);
        }

        .field { margin-bottom: 20px; }

        .field label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text);
        }

        .field select,
        .field input[type="text"],
        .field input[type="url"],
        .field textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            background: #fafbfc;
            transition: border-color 0.2s, background 0.2s;
        }

        .field select:focus,
        .field input:focus,
        .field textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: #fff;
        }

        .field textarea { min-height: 160px; resize: vertical; }
        .field .hint { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

        .preview-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }

        .preview-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            background: #f6f7f9;
            border-radius: 8px;
            max-width: 200px;
        }

        .preview-item img {
            width: 48px;
            height: 48px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid var(--border);
        }

        .preview-item-info {
            flex: 1;
            min-width: 0;
        }

        .preview-item-name {
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .preview-item-size {
            font-size: 11px;
            color: var(--text-muted);
        }

        .preview-item-remove {
            background: none;
            border: none;
            font-size: 16px;
            color: var(--text-muted);
            cursor: pointer;
            padding: 2px;
            line-height: 1;
        }

        .preview-item-remove:hover { color: var(--error); }

        .btn {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover { background: var(--primary-hover); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .spinner {
            width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: none;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 20px;
            display: none;
        }

        .alert.show { display: block; }
        .alert-success { background: var(--success-bg); color: var(--success); }
        .alert-error   { background: var(--error-bg);   color: var(--error); }

        .footer {
            margin-top: 24px;
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h1>📤 发送企业微信通知</h1>
        <p>通过 Webhook 向群组推送消息</p>
    </div>

    <div id="alertBox" class="alert"></div>

    <form id="pushForm">
        <div class="field">
            <label for="type">消息类型</label>
            <select id="type" onchange="toggleType()">
                <option value="markdown">Markdown</option>
                <option value="markdown_v2">Markdown V2</option>
                <option value="text">纯文本</option>
                <option value="image">图片</option>
            </select>
        </div>

        <!-- Markdown / 纯文本内容 -->
        <div class="field" id="contentField">
            <label for="content">消息内容</label>
            <textarea id="content" placeholder="在此输入消息内容..." required></textarea>
            <div class="hint" id="hintType">支持 Markdown 格式</div>
        </div>

        <!-- 图片上传区域 -->
        <div class="field" id="imageUploadField" style="display:none;">
            <label>选择图片</label>
            <input type="file" id="fileInput" accept="image/png,image/jpeg,image/gif,image/webp,image/bmp" multiple
                   style="padding:8px;border:1.5px solid var(--border);border-radius:10px;width:100%;background:#fafbfc;font-size:14px;">
            <div class="hint">可同时选择多张图片，每张最大 10MB，支持 PNG/JPG/GIF/WebP</div>
            <div id="previewArea"></div>
        </div>

        <!-- 图片标题 -->
        <div class="field" id="imageTitleField" style="display:none;">
            <label for="imageTitle">图片标题（可选）</label>
            <input type="text" id="imageTitle" placeholder="选填，会显示在图片上方">
        </div>

        <!-- @所有人 -->
        <div class="field" id="mentionField" style="display:none;">
            <div class="checkbox-row">
                <input type="checkbox" id="mention_all">
                <label for="mention_all">@所有人</label>
            </div>
            <div class="hint">仅当消息类型为"纯文本"时生效</div>
        </div>

        <button type="submit" class="btn" id="sendBtn">
            <span class="spinner" id="spinner"></span>
            <span id="btnText">发送消息</span>
        </button>
    </form>

    <div class="footer">webhook-push &bull; 本地运行，安全可靠</div>
</div>

<script>
    const typeSelect        = document.getElementById('type');
    const contentField      = document.getElementById('contentField');
    const imageUploadField  = document.getElementById('imageUploadField');
    const imageTitleField   = document.getElementById('imageTitleField');
    const mentionField      = document.getElementById('mentionField');
    const hintEl            = document.getElementById('hintType');
    const alertBox          = document.getElementById('alertBox');
    const sendBtn           = document.getElementById('sendBtn');
    const spinner           = document.getElementById('spinner');
    const btnText           = document.getElementById('btnText');
    const contentEl         = document.getElementById('content');
    const fileInput         = document.getElementById('fileInput');
    const previewArea       = document.getElementById('previewArea');
    const imageTitleEl      = document.getElementById('imageTitle');

    let selectedFiles = [];

    function toggleType() {
        const val = typeSelect.value;
        const isText  = val === 'text';
        const isImage = val === 'image';
        mentionField.style.display  = isText  ? 'block' : 'none';
        contentField.style.display  = isImage ? 'none'  : 'block';
        imageUploadField.style.display = isImage ? 'block' : 'none';
        imageTitleField.style.display = isImage ? 'block' : 'none';
        hintEl.textContent = isText ? '仅支持纯文本格式'
                 : isImage ? '可同时选择多张图片发送'
                           : '支持 Markdown 格式';
        contentEl.required = !isImage;
    }

    fileInput.addEventListener('change', () => {
        const newFiles = Array.from(fileInput.files);
        if (newFiles.length === 0) { selectedFiles = []; previewArea.innerHTML = ''; return; }
        for (const file of newFiles) {
            const valid = ['image/png','image/jpeg','image/gif','image/webp','image/bmp'];
            if (!valid.includes(file.type)) { showAlert('不支持的文件类型：' + file.name, 'error'); continue; }
            if (file.size > 10 * 1024 * 1024) { showAlert('图片不能超过 10MB：' + file.name, 'error'); continue; }
            selectedFiles.push(file);
        }
        renderPreviews();
    });

    function renderPreviews() {
        if (selectedFiles.length === 0) { previewArea.innerHTML = ''; return; }
        let html = '<div class="preview-grid">';
        selectedFiles.forEach((file, i) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                html = previewArea.innerHTML;
                const items = previewArea.querySelectorAll('.preview-item');
                if (items[i]) {
                    items[i].querySelector('img').src = e.target.result;
                }
            };
            reader.readAsDataURL(file);
            html += `<div class="preview-item" data-index="${i}">
                <img src="" alt="preview">
                <div class="preview-item-info">
                    <div class="preview-item-name">${file.name}</div>
                    <div class="preview-item-size">${(file.size/1024).toFixed(1)} KB</div>
                </div>
                <button type="button" class="preview-item-remove" onclick="removeFile(${i})">✕</button>
            </div>`;
        });
        html += '</div>';
        previewArea.innerHTML = html;
        // Re-trigger image loads
        selectedFiles.forEach((file, i) => {
            const img = previewArea.querySelector(`.preview-item[data-index="${i}"] img`);
            if (img) {
                const r = new FileReader();
                r.onload = (e) => { img.src = e.target.result; };
                r.readAsDataURL(file);
            }
        });
    }

    window.removeFile = function(index) {
        selectedFiles.splice(index, 1);
        renderPreviews();
    };

    window.clearAllFiles = function() {
        selectedFiles = [];
        previewArea.innerHTML = '';
        fileInput.value = '';
    };

    document.getElementById('pushForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.className = 'alert';
        const isImage = typeSelect.value === 'image';
        const payload = {
            type:        typeSelect.value,
            content:     contentEl.value.trim(),
            mention_all: document.getElementById('mention_all').checked,
            title:       imageTitleEl.value.trim(),
        };

        if (isImage && selectedFiles.length > 0) {
            try {
                payload.base64s = await Promise.all(selectedFiles.map(readFileAsBase64));
            } catch (err) {
                showAlert('❌ 读取图片失败：' + err.message, 'error');
                return;
            }
        }

        sendBtn.disabled = true;
        spinner.style.display = 'block';
        btnText.textContent = '发送中...';

        // Abort after 30 seconds
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 30000);

        try {
            const resp = await fetch('/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
                signal: controller.signal
            });
            clearTimeout(timeout);
            const data = await resp.json();
            if (data.ok) {
                const imgLabel = selectedFiles.length > 1
                    ? `${selectedFiles.length} 张图片`
                    : '1 张图片';
                showAlert(`✅ 成功发送 ${imgLabel} 到 ${data.sent}/${data.total} 个群组！`, 'success');
                if (isImage) clearAllFiles();
            } else {
                let msg = '发送失败';
                if (data.sent > 0) msg += `（部分成功 ${data.sent}/${data.total}）`;
                if (data.error)    msg += '：' + data.error;
                showAlert('❌ ' + msg, 'error');
            }
        } catch (err) {
            clearTimeout(timeout);
            const reason = err.name === 'AbortError'
                ? '请求超时（30秒），图片可能太大，请尝试压缩后重试'
                : err.message;
            showAlert('❌ 请求失败：' + reason, 'error');
        } finally {
            sendBtn.disabled = false;
            spinner.style.display = 'none';
            btnText.textContent = '发送消息';
        }
    });

    function readFileAsBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => {
                // Remove data URL prefix (e.g. "data:image/png;base64,")
                const base64 = reader.result.split(',')[1];
                resolve(base64);
            };
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    function showAlert(msg, type) {
        alertBox.textContent = msg;
        alertBox.className = 'alert alert-' + type + ' show';
        if (type === 'success') contentEl.value = '';
    }

    // 启动时检查服务器是否在线
    async function checkServer() {
        try {
            const resp = await fetch('/', { method: 'HEAD', cache: 'no-cache' });
            if (resp.ok) return true;
        } catch {}
        return false;
    }

    (async () => {
        const ok = await checkServer();
        if (!ok) {
            alertBox.innerHTML = '<div class="alert alert-error">❌ 无法连接到服务器，请先运行 <code>python server.py</code> 后刷新页面。</div>';
            alertBox.className = 'alert show';
        }
    })();

    toggleType();
</script>

</body>
</html>
